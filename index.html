<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tiny City Builder</title>
  </head>
  <body>
    <canvas id="c"></canvas>
    <header id="hud">
      <div class="title">
        <strong>Tiny City Builder</strong>
        <span id="subtitle">City editor</span>
      </div>
      <nav id="modes" aria-label="Mode">
        <button type="button" data-mode="build">🏙<span> Build</span></button>
        <button type="button" data-mode="characters">👤<span> Characters</span></button>
        <button type="button" data-mode="walk">🚶<span> Walk</span></button>
      </nav>
      <button id="back" type="button" hidden>← Back</button>
      <span id="hint"></span>
      <span class="spacer"></span>
      <button id="townsBtn" type="button" title="My towns">📁<span> Towns</span></button>
      <button id="saveBtn" type="button" title="Save the town as a file">💾<span> Save</span></button>
      <button id="loadBtn" type="button" title="Open a town file">📂<span> Open</span></button>
      <button id="viewBtn" type="button" title="Switch camera: isometric / third person (V)" hidden>🎥<span> Iso view</span></button>
      <button id="devBtn" type="button" title="Developer settings">⚙</button>
    </header>
    <main id="grid"></main>
    <main id="propsGrid" class="props-grid" hidden></main>
    <div id="joystick" hidden><div class="knob"></div></div>
    <div id="toast" role="status" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
