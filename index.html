<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tiny City Builder</title>
  </head>
  <body>
    <canvas id="c"></canvas>
    <header id="hud">
      <div class="title"><strong>Tiny City Builder</strong></div>
      <nav id="modes" aria-label="Mode">
        <button type="button" data-mode="catalog">📦<span> Catalogue</span></button>
        <button type="button" data-mode="characters">👤<span> Characters</span></button>
        <button type="button" data-mode="city">🏙<span> City</span></button>
      </nav>
      <span id="hint"></span>
      <span class="spacer"></span>
      <button id="newTownBtn" class="city-only" type="button" title="Generate a different town" hidden>🎲<span> New town</span></button>
      <button id="lightBtn" class="city-only" type="button" title="Time of day" hidden>☀<span> Day</span></button>
      <button id="viewBtn" class="city-only" type="button" title="Isometric / third person (V)" hidden>🎥<span> Iso view</span></button>
    </header>
    <main id="catalog" hidden>
      <div class="cat-tabs"></div>
      <div class="cat-grid"></div>
    </main>
    <aside id="item" hidden></aside>
    <div id="joystick" hidden><div class="knob"></div></div>
    <div id="toast" role="status" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
